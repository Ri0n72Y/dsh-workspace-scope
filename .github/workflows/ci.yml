name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      # Coverage gate: below the configured thresholds this step fails.
      - run: pnpm run test:coverage
      # Hot-test client is generated on demand and is intentionally untracked.
      # This verifies the generator still accepts the canonical client source.
      - name: dynamic client generates
        run: pnpm run gen:dynamic
