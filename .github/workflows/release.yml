name: release

# Pushing the `release` branch publishes a stable version: the workflow
# gates, tags v<package.version>, publishes to npm, and creates the GitHub
# Release. Every step is idempotent, so re-pushing an already-published
# version is a safe no-op.
on:
  push:
    branches: [release]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag push + GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # check includes the tsdown build, which produces the lib/ files npm
      # publishes (lib/ is gitignored, so it must exist before publishing).
      - run: pnpm run check
      - run: pnpm test
      - name: resolve version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: tag the release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists; skipping"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: publish to npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "dsh-workspace-scope@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-workspace-scope@$VERSION already published; skipping"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: create GitHub release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; skipping"
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes "See [CHANGELOG.md](CHANGELOG.md)."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
