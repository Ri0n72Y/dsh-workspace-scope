name: refresh rc5 lockfile (temporary)
on:
  push:
    branches: [feat/opt-in-subagent-policy]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opt-in-subagent-policy
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve rc5 graph
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit reproducible lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: lock DSH 0.2.1-rc.5 dependencies"
            git push origin HEAD:feat/opt-in-subagent-policy
          fi
